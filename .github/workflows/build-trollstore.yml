name: Build sing-box for TrollStore

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to build'
        required: true
        default: 'main'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: 'recursive'

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.0'

      - name: Select Xcode Version
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          echo "Using Xcode at $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Build Go Core
        # 给 make 命令也加上免签参数，防止其附带的 Debug 编译报错
        run: |
          make CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGN_IDENTITY="" \
               ENTITLEMENTS_REQUIRED=NO

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild clean build \
            -project "sing-box.xcodeproj" \
            -scheme "sing-box" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r sing-box-trollstore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-trollstore-ipa
          path: sing-box-trollstore.ipa
