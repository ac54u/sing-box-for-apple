name: Build sing-box for TrollStore

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to build'
        required: true
        default: 'main'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: 'recursive'

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.0' # 确保 Go 版本足够新以编译内核

      - name: Select Xcode Version
        # 升级到较新的 Xcode 15.4 以兼容最新的项目文件
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Go Core
        # 巨魔版免签编译前，必须先生成 Libbox.xcframework 核心依赖
        run: make

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild clean build \
            -project "sing-box.xcodeproj" \
            -scheme "sing-box" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r sing-box-trollstore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-trollstore-ipa
          path: sing-box-trollstore.ipa
