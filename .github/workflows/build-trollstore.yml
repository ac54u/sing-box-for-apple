name: Build TrollStore IPA

on:
workflow_dispatch:
inputs:
branch:
description: Build Branch
required: true
default: main

jobs:
build:
runs-on: macos-15steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      ref: ${{ github.event.inputs.branch }}
      submodules: recursive

  - name: Setup Go
    uses: actions/setup-go@v5
    with:
      go-version: '1.24'

  - name: Cache Go
    uses: actions/cache@v4
    with:
      path: |
        ~/go/pkg/mod
        ~/.cache/go-build
      key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      restore-keys: |
        ${{ runner.os }}-go-

  - name: Select Xcode
    run: |
      if [ -d "/Applications/Xcode_16.4.app" ]; then
        sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      else
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      fi

  - name: Environment
    run: |
      sw_vers
      xcodebuild -version
      go version

  - name: Build Libbox
    run: |
      make

  - name: Build iOS App
    run: |
      xcodebuild \
        -project sing-box.xcodeproj \
        -scheme SFI \
        -configuration Release \
        -destination 'generic/platform=iOS' \
        -derivedDataPath build \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY=""

  - name: Find App
    run: |
      find build -name "*.app"

  - name: Package TrollStore IPA
    run: |
      APP=$(find build -name "*.app" | head -n 1)

      if [ -z "$APP" ]; then
        echo "APP not found"
        exit 1
      fi

      mkdir Payload
      cp -R "$APP" Payload/

      zip -qry sing-box-trollstore.ipa Payload

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: sing-box-trollstore
      path: sing-box-trollstore.ipa
      retention-days: 30
