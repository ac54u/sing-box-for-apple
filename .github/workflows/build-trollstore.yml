name: Build sing-box for TrollStore

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch to build (e.g. main, dev, stable)'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 精准拉取你在触发时输入的分支代码
          ref: ${{ github.event.inputs.target_branch }}
          # 极其关键：必须递归拉取所有子模块（如内核及第三方库 Runestone 等），否则会报找不到库的错
          submodules: 'recursive'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build Go Core (Libbox)
        run: |
          # 提前编译底层内核，跳过签名
          make CODE_SIGNING_ALLOWED=NO

      - name: Build iOS App (No Signature)
        run: |
          # 使用 xcodebuild 或 make 编译免签纯净版 UI 外壳
          xcodebuild clean build \
            -project sing-box.xcodeproj \
            -scheme "sing-box" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

      - name: Package Payload to IPA
        run: |
          # 巨魔安装器直接读取 Payload/*.app 结构，我们将其打包成 .ipa 即可使用
          mkdir -p Payload
          # 将编译生成的 .app 移动到 Payload 文件夹
          cp -r build/Build/Products/Release-iphoneos/sing-box.app Payload/
          # 压缩为巨魔可识别的 .ipa 文件
          zip -r9 sing-box-trollstore-ipa.zip Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # 最后生成供下载的压缩包名字
          name: sing-box-trollstore-ipa
          path: sing-box-trollstore-ipa.zip
