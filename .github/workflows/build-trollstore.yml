name: Build sing-box for TrollStore

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to build'
        required: true
        default: 'main'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14 # 使用较新的 macOS 镜像以支持 iOS 17 SDK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: 'recursive' # 必须拉取子模块，否则核心代码缺失

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.20.0' # sing-box 核心依赖 Go 环境进行编译

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Build iOS App (Unsigned)
        run: |
          # 禁用代码签名进行编译
          xcodebuild clean build \
            -project "sing-box.xcodeproj" \
            -scheme "sing-box" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

      - name: Package IPA for TrollStore
        run: |
          # 巨魔专属打包方式：将编译好的 .app 放入 Payload 文件夹并打包
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r sing-box-trollstore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-trollstore-ipa
          path: sing-box-trollstore.ipa
