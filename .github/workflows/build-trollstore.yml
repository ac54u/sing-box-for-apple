name: Build TrollStore IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Build Branch
        required: true
        default: dev # 默认改为 dev 分支

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          go version

      - name: Build Go Core (Libbox)
        run: |
          set -o pipefail
          
          # 智能判断：如果 dev 分支没有自带内核，我们才去手动克隆，防止冲突报错
          if [ ! -d "sing-box" ]; then
            echo "未检测到内核子模块，手动克隆最新内核..."
            git clone https://github.com/SagerNet/sing-box.git
          else
            echo "已检测到内核文件夹，直接使用..."
          fi
          
          cd sing-box
          make lib_install || true
          make lib_apple 2>&1 | tee ../build-core.log
          
          cd ..
          if [ -d "sing-box/Libbox.xcframework" ]; then
            cp -R sing-box/Libbox.xcframework .
          elif [ -d "sing-box/build/Libbox.xcframework" ]; then
            cp -R sing-box/build/Libbox.xcframework .
          else
            echo "错误：找不到 Libbox.xcframework"
            exit 1
          fi
          echo "内核编译并转移成功！"

      - name: Build iOS App
        run: |
          xcodebuild clean build \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

      - name: Package TrollStore IPA
        run: |
          APP=$(find build -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "APP not found"
            exit 1
          fi

          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry sing-box-trollstore.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-trollstore
          path: sing-box-trollstore.ipa
          retention-days: 30
