name: Build TrollStore IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Build Branch
        required: true
        default: main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive # <--- 加上这一行，把 UI 依赖的子模块拉下来


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          go version

      - name: Build Go Core (Libbox)
        run: |
          set -o pipefail
          
          # 1. 核心修复：由于内核并不是子模块，我们需要手动将其克隆下来
          echo "克隆 sing-box 内核源码..."
          git clone https://github.com/SagerNet/sing-box.git
          cd sing-box
          
          # 2. 执行 Apple 平台专属的内核编译指令
          echo "开始编译 Apple 专属 Go 内核..."
          make lib_install || true # 预先安装必要的编译依赖
          make lib_apple 2>&1 | tee ../build-core.log
          
          # 3. 回到外层根目录
          cd ..
          
          # 4. 把编译好的核心库挪到外层
          if [ -d "sing-box/Libbox.xcframework" ]; then
            cp -R sing-box/Libbox.xcframework .
          elif [ -d "sing-box/build/Libbox.xcframework" ]; then
            cp -R sing-box/build/Libbox.xcframework .
          else
            echo "错误：找不到 Libbox.xcframework，请查看日志！"
            exit 1
          fi
          echo "内核编译并转移成功！"

      - name: Build iOS App
        run: |
          xcodebuild clean build \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

      - name: Package TrollStore IPA
        run: |
          APP=$(find build -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "APP not found"
            exit 1
          fi

          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry sing-box-trollstore.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-trollstore
          path: sing-box-trollstore.ipa
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-core-log
          path: build-core.log
