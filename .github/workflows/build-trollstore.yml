name: Build TrollStore IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Build Branch
        required: true
        default: dev # 默认改为 dev 分支
      core_ref:
        description: sing-box 内核版本 (分支/tag),本仓库 dev 跟随上游 testing 开发分支
        required: true
        default: testing # 本仓库 Swift 代码用到很多新 Libbox API,需上游 testing 分支;锁稳定 tag 会缺符号编译失败

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Select Xcode
        run: |
          # 本仓库依赖(libghostty 的 UIGlassEffect 等)需要 iOS 26 SDK,
          # 选最新的 Xcode 26;找不到再回退到最新可用 Xcode。
          LATEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          fi
          if [ -z "$LATEST" ]; then
            LATEST=/Applications/Xcode.app
          fi
          echo "使用 $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          go version

      - name: Build Go Core (Libbox)
        env:
          CORE_REF: ${{ github.event.inputs.core_ref }}
        run: |
          set -o pipefail

          # 智能判断：如果 dev 分支没有自带内核，我们才去手动克隆，防止冲突报错
          if [ ! -d "sing-box" ]; then
            echo "未检测到内核子模块，按指定版本 ($CORE_REF) 克隆内核..."
            git clone --depth 1 -b "$CORE_REF" https://github.com/SagerNet/sing-box.git
          else
            echo "已检测到内核文件夹，直接使用..."
          fi

          cd sing-box
          make lib_install || true
          make lib_apple 2>&1 | tee ../build-core.log

          cd ..
          if [ -d "sing-box/Libbox.xcframework" ]; then
            cp -R sing-box/Libbox.xcframework .
          elif [ -d "sing-box/build/Libbox.xcframework" ]; then
            cp -R sing-box/build/Libbox.xcframework .
          else
            echo "错误：找不到 Libbox.xcframework"
            exit 1
          fi
          echo "内核编译并转移成功！"

      - name: Build iOS App
        run: |
          xcodebuild clean build \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

      - name: Package TrollStore IPA
        env:
          GH_WS: ${{ github.workspace }}
        run: |
          set -o pipefail

          # 精确定位产物，避免 find 命中 DerivedData 中间产物
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -n 1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "APP not found"
            exit 1
          fi
          echo "找到 App: $APP"

          # TrollStore 需要二进制内嵌 entitlements,否则 VPN(网络扩展)无法启动。
          # 用 ldid 对主程序及各扩展按各自的 entitlements 做 fakesign。
          brew install ldid

          fakesign() {
            # $1 = bundle 目录, $2 = entitlements 文件
            local bundle="$1" ent="$2"
            local exec_name
            exec_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist" 2>/dev/null)
            if [ -z "$exec_name" ] || [ ! -f "$bundle/$exec_name" ]; then
              echo "  跳过(找不到可执行文件): $bundle"
              return
            fi
            if [ ! -f "$ent" ]; then
              echo "  跳过(找不到 entitlements: $ent): $bundle"
              return
            fi
            echo "  签名 $bundle/$exec_name  <-  $ent"
            ldid -S"$ent" "$bundle/$exec_name"
          }

          echo "对主 App 签名..."
          fakesign "$APP" "$GH_WS/SFI/SFI.entitlements"

          if [ -d "$APP/PlugIns" ]; then
            echo "对扩展签名..."
            for appex in "$APP"/PlugIns/*.appex; do
              [ -d "$appex" ] || continue
              name=$(basename "$appex" .appex)   # 扩展名 = target 名,对应 <name>/<name>.entitlements
              fakesign "$appex" "$GH_WS/$name/$name.entitlements"
            done
          fi

          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry sing-box-trollstore.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-trollstore
          path: sing-box-trollstore.ipa
          retention-days: 30

      - name: Upload Core Build Log
        if: always() # 即使内核编译失败也上传,方便排查
        uses: actions/upload-artifact@v4
        with:
          name: build-core-log
          path: build-core.log
          retention-days: 30
          if-no-files-found: warn
